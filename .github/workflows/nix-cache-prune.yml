name: Prune Nix binary cache

on:
  schedule:
    # Every Monday at 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/nix-cache-prune/go.mod
          cache-dependency-path: scripts/nix-cache-prune/go.sum

      # Retention, grace period, delete cap and the dry-run default live in the
      # tool; the schedule only has to say "actually delete".
      - name: Prune cache
        working-directory: scripts/nix-cache-prune
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_AWS_SECRET_ACCESS_KEY }}
          NIX_CACHE_BUCKET: ${{ secrets.NIX_CACHE_BUCKET }}
          NIX_CACHE_ENDPOINT: ${{ secrets.NIX_CACHE_ENDPOINT }}
          NIX_CACHE_REGION: ${{ secrets.NIX_CACHE_REGION }}
        run: go run ./cmd/nix-cache-prune --delete --verbose
