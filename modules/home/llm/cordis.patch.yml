# built-in DeepSeek: disabled entirely
- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

# My MCPs
- insert:
    # Gateway MCPs (plexus proxies them behind GATEWAY_API_KEY auth).
    - id: mcp-context7
      name: "@monotykamary/dsh-mcp-client"
      config:
        serverName: context7
        transport: streamable-http
        url: !!js '(process.env.GATEWAY_API_BASE ?? "http://127.0.0.1:4000") + "/mcp/context7"'
        headers:
          Authorization: !!js '"Bearer " + process.env.GATEWAY_API_KEY'

    - id: mcp-exa
      name: "@monotykamary/dsh-mcp-client"
      config:
        serverName: exa
        transport: streamable-http
        url: !!js '(process.env.GATEWAY_API_BASE ?? "http://127.0.0.1:4000") + "/mcp/exa"'
        headers:
          Authorization: !!js '"Bearer " + process.env.GATEWAY_API_KEY'

    # Local MCPs. First connection may build/download while the tool cache is
    # cold (go/nix/bunx caches under $HOME make later starts instant).
    - id: mcp-godoc
      name: "@monotykamary/dsh-mcp-client"
      config:
        serverName: godoc
        transport: stdio
        command: go
        args:
          - run
          - github.com/mrjoshuak/godoc-mcp@latest
        env:
          CGO_ENABLED: "0"

    - id: mcp-nixos
      name: "@monotykamary/dsh-mcp-client"
      config:
        serverName: nixos
        transport: stdio
        command: nix
        args:
          - run
          - github:utensils/mcp-nixos
          - "--"

    - id: mcp-pdf-reader
      name: "@monotykamary/dsh-mcp-client"
      config:
        serverName: pdf-reader
        transport: stdio
        command: bunx
        args:
          - "@sylphx/pdf-reader-mcp"

