# DSH user settings (~/.dsh/settings.yaml)
ui-onboarding:
  welcomeNoticeVersion: "2026-08-23.1"

ui-theme:
  preference: dark

agent-presets:
  default: fabric

ui-conversation:
  busyEnter: steer

session-title-llm:
  enabled: true

agent-default-model:
  provider: gateway
  model: default

llm-pi-ai:
  providers:
    gateway:
      displayName: Gateway
      apiKeyEnv: GATEWAY_API_KEY
      api: openai-completions
      baseURL: http://localhost:4000/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      defaultContextWindow: 1000000
      defaultMaxTokens: 132000
      defaultInput:
        - text
        - image
      models:
        - id: default
          name: "Gateway: default"
          contextWindow: 1000000
          maxTokens: 132000
          input:
            - text
            - image
          reasoningEfforts: false
        - id: smart
          name: "Gateway: smart"
          contextWindow: 1000000
          maxTokens: 132000
          input:
            - text
            - image
          reasoningEfforts: false
        - id: fast
          name: "Gateway: fast"
          contextWindow: 1000000
          maxTokens: 132000
          input:
            - text
            - image
          reasoningEfforts: false
