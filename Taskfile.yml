version: "3"

includes:
  secrets:
    taskfile: ../infrastructure-secrets/Taskfile.yml
    dir: ../infrastructure-secrets
    flatten: true

tasks:
  ci:
    cmds:
      - task: generate
      - gitleaks git --redact --staged
      - gitleaks git --redact
      - treefmt
      - deadnix --fail
      - statix check

  update:
    desc: Update everything
    cmds:
      - task: update-inputs
      - task: update-opencode-plugins

  update-inputs:
    desc: |
      Can also update a specific input with: task update-inputs -- <input-name>
    cmds:
      - nix flake update --flake 'path:{{.ROOT_DIR}}' {{.CLI_ARGS}}

  update-secrets:
    desc: Update secrets
    cmds:
      - task update -- infrastructure-secrets

  update-opencode-plugins:
    desc: |
      Update opencode plugin pins in modules/home/llm/agent.nix against npm
      dist-tags. Add --dry-run to only report available updates.
    cmds:
      - nix run path:{{.ROOT_DIR}}/lib/opencode-plugins#opencode-plugins-update -- --file {{.ROOT_DIR}}/modules/home/llm/agent.nix {{.CLI_ARGS}}

  generations:
    desc: List generations
    cmds:
      - nixos-rebuild list-generations

  clean:
    desc: Clean garbage older than 10d
    cmds:
      - sudo nix-collect-garbage --delete-older-than 10d

  generate:
    desc: Regenerate the fast stats artifacts and the dependency graph
    cmds:
      - task: generate-fast
      - task: generate-flake-graph

  generate-fast:
    desc: Fast stats tier; refreshes automatically on every commit
    cmds:
      - python3 scripts/flake_stats.py {{.CLI_ARGS}}

  generate-heavy:
    desc: Heavy stats tier; measured results, budgeted under 5 minutes
    cmds:
      - python3 scripts/flake_stats.py --heavy {{.CLI_ARGS}}

  generate-flake-graph:
    desc: Generate flake graph
    cmd: python3 scripts/flake_graph.py
